user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    client_max_body_size 20M;

    upstream app_servers {
        server afcstudio:8080;
    }
# ==========================================
    # 1. САЙТ: AFC STUDIO (afcstudio.ru)
    # ==========================================

    # HTTP (Порт 80) — редирект на HTTPS и проверка Certbot
    server {
        listen 80;
        listen [::]:80;
        server_name afcstudio.ru www.afcstudio.ru;

        # Проверка от Certbot для выпуска/продления сертификатов
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Редирект всего остального трафика на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS (Порт 443) — Безопасное проксирование в контейнер afcstudio
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name afcstudio.ru www.afcstudio.ru;

        # Пути к SSL сертификатам Let's Encrypt (маппятся из папки certbot)
        ssl_certificate /etc/nginx/ssl/live/afcstudio.ru/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/afcstudio.ru/privkey.pem;

        # Оптимальные настройки безопасности SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            # Проксируем на имя сервиса в Docker-сети
            proxy_pass http://afcstudio:8080; 
            
            # Передача оригинальных заголовков для корректной работы .NET приложения
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ==========================================
    # 2. САЙТ: МОТО ЗАПЧАСТИ (motosalvage.ru)
    # ==========================================

    # HTTP (Порт 80) — редирект на HTTPS и проверка Certbot
    server {
        listen 80;
        listen [::]:80;
        server_name motosalvage.ru www.motosalvage.ru;

        # Проверка от Certbot для выпуска/продления сертификатов
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Редирект всего остального трафика на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS (Порт 443) — Безопасное проксирование в контейнер motoparts-api
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name motosalvage.ru www.motosalvage.ru;

        # Пути к SSL сертификатам Let's Encrypt для второго домена
        ssl_certificate /etc/nginx/ssl/live/motosalvage.ru/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/motosalvage.ru/privkey.pem;

        # Оптимальные настройки безопасности SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            # Проксируем на container_name из docker-compose проекта запчастей
            proxy_pass http://motoparts-api:8080; 

            # Передача оригинальных заголовков для корректной работы .NET приложения
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
